<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>가이드 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body>
<main id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <h1>가이드 관리자</h1>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">로그인</button>
    <p id="login-error" class="login-error" role="alert"></p>
  </form>
</main>

<div id="editor" hidden>
  <header class="bar">
    <h1>가이드 관리자 <span id="dirty" class="dot" role="img" aria-label="저장되지 않은 변경 사항" title="저장되지 않은 변경 사항" hidden></span></h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-visual" aria-controls="visual" aria-selected="true">페이지</button>
      <button type="button" role="tab" id="tab-form" aria-controls="form" aria-selected="false">Form</button>
      <button type="button" role="tab" id="tab-json" aria-controls="json" aria-selected="false">JSON</button>
    </div>
    <div class="actions">
      <a class="btn" href="/" target="_blank" rel="noopener">미리보기</a>
      <button type="button" id="history-open">이력</button>
      <button type="button" id="save" class="primary">저장</button>
      <button type="button" id="logout">로그아웃</button>
    </div>
  </header>

  <div id="errors" class="errors" role="alert" hidden>
    <div class="errors-head">
      <strong id="errors-title">저장 실패: 아래 항목을 고쳐 주세요</strong>
      <button type="button" id="errors-close">닫기</button>
    </div>
    <ul id="errors-list"></ul>
  </div>

  <section id="visual" class="visual" role="tabpanel" aria-labelledby="tab-visual">
    <div class="visual-tools">
      <label>페이지 <select id="visual-page"></select></label>
      <select id="visual-add" aria-label="블록 추가"></select>
      <button type="button" id="visual-settings">페이지 설정</button>
      <span class="hint">점선 글자를 눌러 바로 고치세요. 블록에 마우스를 올리면 이동·삭제·세부 편집 막대가 나옵니다. 고친 내용은 지금 보이는 언어(KO/EN/中)에 들어가고, 저장을 눌러야 반영됩니다. 굵은 글씨(**)가 든 글과 링크·이미지 경로는 '세부 편집'에서 고칩니다.</span>
    </div>
    <div class="visual-body">
      <iframe id="visual-frame" title="페이지 편집 화면"></iframe>
      <aside id="drawer" class="drawer" aria-labelledby="drawer-title" hidden>
        <div class="errors-head"><h2 id="drawer-title"></h2><button type="button" id="drawer-close">닫기</button></div>
        <div id="drawer-body"></div>
      </aside>
    </div>
  </section>

  <main class="content">
    <section id="form" role="tabpanel" aria-labelledby="tab-form" hidden></section>
    <section id="json" role="tabpanel" aria-labelledby="tab-json" hidden>
      <div class="json-tools">
        <button type="button" id="json-check">검증</button>
        <span id="json-status" role="status"></span>
      </div>
      <textarea id="json-text" spellcheck="false" aria-label="콘텐츠 JSON"></textarea>
    </section>
  </main>
</div>

<dialog id="history" class="history" aria-labelledby="history-title">
  <div class="errors-head">
    <h2 id="history-title">저장 이력</h2>
    <button type="button" id="history-close">닫기</button>
  </div>
  <ul id="history-list"></ul>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
